<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Travel Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>✈️ AI Travel Planner</h1>
    <p>Tell us where you want to go, your budget and number of days. We'll build your trip.</p>
  </header>

  <main class="container">
    <!-- INPUT FORM -->
    <form id="planner-form" class="card">
      <div class="field">
        <label for="destination">Destination</label>
        <input id="destination" type="text" list="destination-list"
               placeholder="e.g. Goa, Jaipur, Paris, Tokyo" required />
        <datalist id="destination-list"></datalist>
      </div>

      <div class="row">
        <div class="field">
          <label for="days">Number of days</label>
          <input id="days" type="number" min="1" max="14" value="3" required />
        </div>
        <div class="field">
          <label for="travelers">Travelers</label>
          <input id="travelers" type="number" min="1" max="20" value="2" required />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="budget">Total budget (₹)</label>
          <input id="budget" type="number" min="1000" step="500" value="40000" required />
        </div>
        <div class="field">
          <label for="style">Travel style</label>
          <select id="style">
            <option value="budget">Budget (hostels, street food)</option>
            <option value="standard" selected>Standard (3-star hotels)</option>
            <option value="luxury">Luxury (5-star, fine dining)</option>
          </select>
        </div>
      </div>

      <button type="submit">Generate my itinerary</button>
    </form>

    <!-- RESULTS -->
    <section id="result" class="hidden">
      <h2 id="result-title"></h2>

      <div id="budget-card" class="card"></div>

      <h3>Daily itinerary</h3>
      <div id="itinerary"></div>

      <button id="print-btn" type="button" class="secondary">🖨️ Print / Save as PDF</button>
    </section>
  </main>

  <footer>Built as a student project • Estimates are approximate, flights not included</footer>

  <script src="script.js"></script>
</body>
</html>
